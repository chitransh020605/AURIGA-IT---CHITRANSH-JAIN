<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month-end billing — DabbaLedger</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">DabbaLedger</div>
  <div>
    <a href="dashboard.html">Customers</a>
    <a href="billing.html">Month-end billing</a>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="app-shell">
  <div class="panel">
    <h2>Month-end billing</h2>
    <div class="toolbar">
      <label for="monthPicker" class="small" style="margin:0;">Month</label>
      <input type="month" id="monthPicker">
      <select id="pageSize">
        <option value="10">10 / page</option>
        <option value="25">25 / page</option>
        <option value="50">50 / page</option>
      </select>
      <span id="totalRevenue" class="small" style="margin-left:auto; font-weight:600;"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th data-sort="customer_name">Customer</th>
          <th>Phone</th>
          <th>Plan</th>
          <th data-sort="deliveredDays">Delivered days</th>
          <th>Total weekdays</th>
          <th data-sort="amount">Amount due</th>
        </tr>
      </thead>
      <tbody id="billRows"></tbody>
    </table>

    <div class="pagination">
      <button class="secondary" id="prevPage">Prev</button>
      <span id="pageInfo" class="small"></span>
      <button class="secondary" id="nextPage">Next</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/billing.js"></script>
</body>
</html>
